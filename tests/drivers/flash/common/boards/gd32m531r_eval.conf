# This is the board's auto-applied default conf (matches the board name, so
# a bare `west build -b gd32m531r_eval tests/drivers/flash/common` picks it
# up with no extra flags). It targets the external SPI NOR (spi_flash0).
# To test the on-chip flash0 instead, pass
# -DEXTRA_CONF_FILE=boards/gd32m531r_eval_internal.conf (or use the
# drivers.flash.common.gd32_internal twister scenario, which does this for
# you).
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# The GD32 SPI driver registers a deinit handler; reference it to avoid an
# unused-function build error (-Werror) when the SPI NOR device is released.
CONFIG_DEVICE_DEINIT_SUPPORT=y

# gd25q16 SPI NOR is 16 Mbit = 2 MB; enable flash_get_size verification so
# the get_size test runs (PASS) instead of being skipped.
CONFIG_TEST_DRIVER_FLASH_SIZE=2097152
