description: |
  GigaDevice GD32 I2C, ADD IP variant (TIMING/STAT/STATC/RDATA/TDATA registers).
  The legacy GD32 I2C IP (STAT0/STAT1/CKCFG registers) uses "gd,gd32-i2c".

compatible: "gd,gd32-i2c-v2"

include: [i2c-controller.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  resets:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
