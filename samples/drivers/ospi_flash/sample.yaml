sample:
  name: GD32 OSPI Flash Sample
common:
  tags:
    - flash
    - ospi
  depends_on: ospi
tests:
  sample.drivers.ospi.flash:
    filter: dt_compat_enabled("gd,gd32-ospi-nor")
    platform_allow:
      - gd32h759i_eval
    integration_platforms:
      - gd32h759i_eval
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Test 1: Flash erase"
        - "Flash erase succeeded!"
        - "Test 2: Flash write"
        - "Attempting to write 128 bytes"
        - "Data read matches data written. Good!!"
