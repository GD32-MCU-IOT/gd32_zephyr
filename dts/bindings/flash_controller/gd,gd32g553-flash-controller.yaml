description: |
  GD32G5x3 flash controller.

  The main flash starts at 0x08000000 and holds Bank0 and Bank1 (up to
  2 x 256KB). Pages are 1KB in dual-bank mode (factory default) and 2KB
  in single-bank mode. The flash is programmed in 64-bit double-words.

  The main flash is a "gd,gd32-nv-flash" child node that also carries
  "soc-nv-flash" and must use write-block-size = <8>.

compatible: "gd,gd32g553-flash-controller"

include: flash-controller.yaml
