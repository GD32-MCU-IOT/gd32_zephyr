description: GD32 OSPI controller

compatible: "gd,gd32-ospi"

include: [base.yaml, pinctrl-device.yaml]

bus: ospi

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-names:
    required: true

  clocks:
    required: true

  resets:
    type: phandle-array
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
