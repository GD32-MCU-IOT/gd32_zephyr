#
# Board-specific config for the LVGL sample on GD32H759I-EVAL.
# The GT911 is polled from the system work queue. Deliver its events to LVGL
# synchronously and enlarge the LVGL input queue so that no release event is
# dropped while LVGL is busy rendering.

CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64
