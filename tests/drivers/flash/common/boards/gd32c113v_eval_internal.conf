# nor_flash stays enabled in the board DTS (matches the board's default
# .dts), so CONFIG_SPI_NOR would otherwise auto-default to y and make
# main.c target nor_flash instead of flash0's storage_partition. Force it
# off here so this scenario always exercises the on-chip flash.
CONFIG_SPI_NOR=n

# On-chip flash0 is 128 KB; enable flash_get_size verification so the
# get_size test runs (PASS) instead of being skipped.
CONFIG_TEST_DRIVER_FLASH_SIZE=131072
