description: |
  GD32F527 flash controller.

  The FMC drives a single main flash region at 0x08000000. It is programmed
  in 64-bit double-words, each protected by an 8-bit ECC. Pages are 4KB and
  are also the minimum erase unit.

  The main flash is a "gd,gd32-nv-flash" child node that also carries
  "soc-nv-flash", and must use write-block-size = <8> and page-size = <4096>
  (equal to gd,program-unit-bytes and gd,page-bytes); the driver checks both
  at build time.

  This compatible must be listed before "gd,gd32-flash-controller" on the
  FMC node, so this binding applies to the node and its gd,* properties are
  available to the driver.

compatible: "gd,gd32f527-flash-controller"

include: gd,gd32-flash-controller.yaml

properties:
  gd,program-unit-bytes:
    type: int
    required: true
    const: 8
    description: |
      Main flash is programmed in 64-bit double-words, each protected by an
      ECC code.

  gd,ecc-bits:
    type: int
    required: true
    const: 8
    description: ECC bits stored with each double-word of main flash.

  gd,page-bytes:
    type: int
    required: true
    const: 4096
    description: Main flash page size, which is also the minimum erase unit.
